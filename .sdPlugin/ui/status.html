<!DOCTYPE html>
<html>
	<head lang="en">
		<title>Paseo Status</title>
		<meta charset="utf-8" />
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	</head>
	<body>
		<sdpi-item label="Daemons">
			<sdpi-textarea
				setting="daemons"
				global
				rows="4"
				placeholder="ws://127.0.0.1:6767/ws&#10;Homelab | ws://192.168.0.138:6767/ws&#10;Label | url | password"
			></sdpi-textarea>
		</sdpi-item>
		<sdpi-item label="Paseo app">
			<sdpi-textfield
				setting="paseoPath"
				global
				placeholder="auto-detect"
			></sdpi-textfield>
		</sdpi-item>
	</body>
</html>
